 {id:"gold",loc:"beach",price:990,ru:{n:"Золотой Стандарт",s:"Безупречный стиль и включённый образ невесты.",a:"Пакет для тех, кто ценит качество и не хочет рисковать. Главное преимущество: мы уже включили в стоимость услуги профессионального стилиста. Вам не нужно искать мастеров в Азии: ваш макияж и причёска будут идеальны, а церемония продумана до мелочей.",i:["💄 Стилист: профессиональный макияж и причёска (выезд в ваш отель).","🌟 Всё из тарифа «Основной»: живые цветы, ведущий, шампанское.","📸 Фото-премиум: расширенная ретушь и помощь в позировании.","💒 Улучшенный декор: дополнительные элементы оформления прохода или зоны регистрации.","🧁 Комплимент: расширенный фуршет (пирожные или улучшенные фрукты)."]},
  en:{n:"Gold Standard",s:"Flawless style and the bride's look included.",a:"For those who value quality and don't want to risk. The main benefit: a professional stylist is already included. No need to look for masters in Asia: your makeup and hair will be perfect and the ceremony thought through.",i:["💄 Stylist: professional makeup and hair (at your hotel).","🌟 Everything from \"Main\": live flowers, host, champagne.","📸 Photo premium: extended retouching and posing help.","💒 Upgraded decor: extra elements for the aisle or registration area.","🧁 Compliment: extended buffet (pastries or upgraded fruit)."]}},

 {id:"comfort",loc:"beach",price:1500,ru:{n:"Комфорт (VIP)",s:"Максимальные возможности и свобода желаний.",a:"Это не просто пакет, это конструктор вашего идеального дня. Вы получаете полную свободу: в стоимость уже заложен бюджет на любые дополнительные услуги. Хотите видеоклип, джип-тур или ужин на пляже? Мы реализуем любой сценарий, чтобы вы чувствовали абсолютный комфорт.",i:["💎 Всё включено: база тарифа «Золотой Стандарт» (стилист, цветы, ведущий).","💰 Депозит $500: включён бюджет на выбор доп. услуг (видеограф / джип / дрон / ужин). Это бюджет на допы, а не предоплата за бронь.","🚘 Логистика: приоритетная организация трансфера и сложных маршрутов.","🥥 Песочная церемония: красивый ритуал объединения семей в подарок.","🕶 VIP-сопровождение: личный контроль организатора 24/7."]},
  en:{n:"Comfort (VIP)",s:"Maximum possibilities and freedom of wishes.",a:"Not just a package but a builder of your perfect day. Full freedom: a budget for any extra services is already included. Want a video clip, jeep tour or beach dinner? We realize any scenario so you feel absolute comfort.",i:["💎 All inclusive: base of \"Gold Standard\" (stylist, flowers, host).","💰 $500 deposit: budget for extras (videographer / jeep / drone / dinner) included. It is an extras budget, not a booking prepayment.","🚘 Logistics: priority transfer and complex route organization.","🥥 Sand ceremony: a beautiful family-unity ritual as a gift.","🕶 VIP support: personal organizer control 24/7."]}},

 if(loc=="pool"&&(v.match(/\d+/)||[0])[0]>CONFIG.poolMax)return b.unk;
 const a=CONFIG.addons.find(a=>a.kw&&new RegExp(a.kw).test(v));if(a){if(!a.l.includes(loc))return b.notHere;const t=a.t&&a.t[loc],p=a.p&&a.p[loc];return`${a[L][0]}: ${a[L][1]} ${tt().forT} ${t?t.map(tn).join(", "):tt().all}. ${typeof p=="number"?usd(p):b.priceTbd}`}
 if(/арк|arch/.test(v))return b.arch;
 if(/стоит|цен|price|cost|how much|сколько/.test(v))return P.map(t=>tf(t).n+": "+usd(t.price)).join("\n");
 if(/отлич|differ|compar/.test(v))return b.diff[loc];
 if(/дожд|rain|погод|weather/.test(v)){if(loc=="pool")return b.rainPool;const f=CONFIG.faq.beach[0],r=L=="ru"?f[2]:f[3];return r[0]=="["?b.unk:r}
 if(/торт|cake|шампан|champagne|22:00|крыт|правил|rules|вместим|capacity/.test(v)||(loc=="pool"&&/гост|guest/.test(v)))return b.rules;
 if(/дат|date|свобод|avail/.test(v))return b.dates;
 const tr=CONFIG.tariffs.find(t=>v.includes(tf(t).n.toLowerCase().split(" ")[0])&&t.price);if(tr&&/вход|includ|что/.test(v))return b.first+"\n"+tf(tr).i.join("\n");
 return b.unk}
function handle(x){add(x,1);
 if(mode=="lead"){const k=keys[li];
  if(k=="loc")setLoc(/бассейн|pool/i.test(x)?"pool":"beach",false);
  else if(k=="name"){S.name=x;$("#fn").value=x}else if(k=="date"){S.date=x;if(/^\d{4}-\d\d-\d\d$/.test(x))$("#fd").value=x}
  else if(k=="guests"){S.guests=x;$("#fg").value=x;upd();if(S.loc=="pool"&&(x.match(/\d+/)||[0])[0]>CONFIG.poolMax)add(tt().b.unk)}
  else if(k=="fmt"){const i=tt().fm.findIndex(f=>f.toLowerCase()==x.toLowerCase());i>=0?S.fmt=i:S.fmtRaw=x;renderFmt()}
  else if(k=="tariff"){const r=CONFIG.tariffs.find(t=>t.loc==S.loc&&x.toLowerCase().includes(tf(t).n.toLowerCase().split(" ")[0]));if(r){S.tariff=r.id;prune();refresh()}}
  else if(k=="budget"){const i=tt().bd[S.loc].findIndex(f=>f.toLowerCase()==x.toLowerCase());i>=0?S.budget=i:S.budgetRaw=x;renderTariffs()}
  else if(k=="contact"){S.contact=x;$("#fc").value=x}
  li++;return ask()}
 if(/заявк|request|leave/i.test(x)){mode="lead";li=0;return ask()}
 add(answer(x))}
$("#chatBtn").onclick=()=>{$("#chat").classList.add("open");$("#chatBtn").style.display="none";if(!$("#msgs").children.length){add(tt().b.hi);qr(tt().b.qs)}$("#ci").focus()};
$("#cx").onclick=()=>{$("#chat").classList.remove("open");$("#chatBtn").style.display=""};
$("#qr").onclick=e=>{if(e.target.tagName=="BUTTON")handle(e.target.textContent)};
$("#cf").onsubmit=e=>{e.preventDefault();const v=$("#ci").value.trim();if(v){$("#ci").value="";handle(v)}};
render();
</script></body></html>
