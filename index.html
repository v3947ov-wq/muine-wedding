 for(const g of["atm","exp","emo"]){const it=CONFIG.addons.filter(a=>a.g==g&&av(a)!="hide");if(it.length)h+=`<h3 class="gt">${t.grp[g]}</h3><div class="ag">${it.map(card).join("")}</div>`}$("#addG").innerHTML=h}

 return{n:it.length,names:it.map(a=>a[L][0]).join(", "),price:all?(cf?usd(Math.max(0,sum-500))+" ("+t.cfNote+")":usd(sum)):(cf?t.cfTbd:t.tbdP)}}

function renderCal(){let h="";const t=new Date(),bz=CONFIG.busy[S.loc],fz=CONFIG.freeDates[S.loc];for(let m=0;m<3;m++){const f=new Date(t.getFullYear(),t.getMonth()+m,1),days=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
 h+=`<div><h3>${f.toLocaleDateString(L,{month:"long",year:"numeric"})}</h3><div class="mg">`+"<span></span>".repeat((f.getDay()+6)%7);
 for(let d=1;d<=days;d++){const x=new Date(f.getFullYear(),f.getMonth(),d),k=new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10),past=x<=t,busy=bz.includes(k)||(fz.length>0&&!fz.includes(k));

function rec(){if(S.fmt===3)return{k:"photo"};if(S.loc=="pool"&&S.budget===0)return{k:"low"};const b=CONFIG.budgets[S.loc][S.budget],pr=CONFIG.tariffs.filter(x=>x.loc==S.loc&&x.price).sort((a,b)=>a.price-b.price);

function renderQuiz(){const q=$("#qbody"),s=S.step,t=tt();$("#bar").style.width=Math.min(s,5)*20+"%";if(s==5)return result(q);
 let body;if(s==1)body=`<input type="date" id="qi" value="${S.date}" min="${iso(new Date())}" aria-label="${t.q[1]}">`;
 else if(s==2)body=`<input type="number" id="qi" min="1" ${S.loc=="pool"?`max="${CONFIG.poolMax}"`:""} value="${S.guests}" aria-label="${t.q[2]}">${S.over?`<div class="res"><p>${t.over10}</p></div><button class="btn" id="qo1">${t.showBeach}</button> <button class="btn o" id="qo2" style="color:#fff">${t.discuss}</button>`:""}`;
 else{const list=s==0?t.loc:s==3?t.fm:t.bd[S.loc],cur=s==0?["beach","pool"].indexOf(S.loc):s==3?S.fmt:S.budget;body=`<div class="opts">${list.map((o,i)=>`<button class="opt ${cur===i?"on":""}" data-o="${i}">${o}</button>`).join("")}</div>`}
 q.innerHTML=`<h3 style="color:#fff">${t.q[s]}</h3>${body}<div>${s?`<button class="btn o" id="qb" style="color:#fff">${t.back}</button> `:""}<button class="btn" id="qn">${t.next}</button></div>`;

document.addEventListener("click",e=>{const g=e.target.closest("[data-l],[data-lc],[data-t],[data-o],[data-f],[data-d],[data-a],[data-copy]");if(!g)return;const d=g.dataset;

let mode="",li=0;const keys=["loc","name","date","guests","fmt","tariff","budget","contact"];
const add=(x,u)=>{const m=document.createElement("div");m.className="m"+(u?" u":"");m.textContent=x;$("#msgs").append(m);m.scrollIntoView()};

function answer(x){const b=tt().b,v=x.toLowerCase(),loc=/бассейн|pool/.test(v)?"pool":/пляж|beach/.test(v)?"beach":S.loc,P=CONFIG.tariffs.filter(t=>t.price&&t.loc==loc);
 if(/дрон|drone|джип|jeep|фейерверк|firework|предоплат|отмен|prepay|cancel|залог|адрес|address|название|bar name|артист|artist|огнен|fire/.test(v))return b.unk;
 if(loc=="pool"&&(v.match(/\d+/)||[0])[0]>CONFIG.poolMax)return b.unk;
 const a=CONFIG.addons.find(a=>a.kw&&new RegExp(a.kw).test(v));if(a){if(!a.l.includes(loc))return b.notHere;const t=a.t&&a.t[loc],p=a.p&&a.p[loc];return`${a[L][0]}: ${a[L][1]} ${tt().forT} ${t?t.map(tn).join(", "):tt().all}. ${typeof p=="number"?usd(p):b.priceTbd}`}
 if(/арк|arch/.test(v))return b.arch;
 if(/стоит|цен|price|cost|how much|сколько/.test(v))return P.map(t=>tf(t).n+": "+usd(t.price)).join("\n");
 if(/отлич|differ|compar/.test(v))return b.diff[loc];
 if(/дожд|rain|погод|weather/.test(v)){if(loc=="pool")return b.rainPool;const f=CONFIG.faq.beach[0],r=L=="ru"?f[2]:f[3];return r[0]=="["?b.unk:r}
 if(/торт|cake|шампан|champagne|22:00|крыт|правил|rules|вместим|capacity/.test(v)||(loc=="pool"&&/гост|guest/.test(v)))return b.rules;
 if(/дат|date|свобод|avail/.test(v))return b.dates;
 const tr=CONFIG.tariffs.find(t=>v.includes(tf(t).n.toLowerCase().split(" ")[0])&&t.price);if(tr&&/вход|includ|что/.test(v))return b.first+"\n"+tf(tr).i.join("\n");
 return b.unk}
function handle(x){add(x,1);
 if(mode=="lead"){const k=keys[li];
  if(k=="loc")setLoc(/бассейн|pool/i.test(x)?"pool":"beach");
  else if(k=="name")S.name=x;else if(k=="date")S.date=x;
  else if(k=="guests"){S.guests=x;if(S.loc=="pool"&&(x.match(/\d+/)||[0])[0]>CONFIG.poolMax)add(tt().b.unk)}
  else if(k=="fmt"){const i=tt().fm.findIndex(f=>f.toLowerCase()==x.toLowerCase());i>=0?S.fmt=i:S.fmtRaw=x}
  else if(k=="tariff"){const r=CONFIG.tariffs.find(t=>t.loc==S.loc&&x.toLowerCase().includes(tf(t).n.toLowerCase().split(" ")[0]));if(r){S.tariff=r.id;prune();refresh()}}
  else if(k=="budget"){const i=tt().bd[S.loc].findIndex(f=>f.toLowerCase()==x.toLowerCase());i>=0?S.budget=i:S.budgetRaw=x}
  else if(k=="contact")S.contact=x;
  li++;return ask()}
 if(/заявк|request|leave/i.test(x)){mode="lead";li=0;return ask()}
 add(answer(x))}
