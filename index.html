 {id:"main",loc:"beach",price:790,pop:1,ru:{n:"Основной",s:"Наш самый популярный выбор: живые цветы и большая съёмка.",a:"Золотая середина и выбор большинства пар. Этот пакет включает всё, что нужно для идеальной «картинки»: стильную флористику, расширенную фотосессию и полную координацию дня. Вы получаете результат, достойный обложки журнала, по честной цене.",i:["🌺 Живая флористика: арка украшена композициями из свежих тропических цветов.","📸 Фото-макси: полная съёмка до 4 часов (сборы + церемония + закат на территории отеля/пальм).","🥂 Сервис: шампанское, бокалы, фруктовая тарелка и столик для росписи.","💍 Детали: букет невесты и бутоньерка из живых цветов.","📝 Координация: полный тайминг и контроль подрядчиков."]},
  en:{n:"Main",s:"Our most popular choice: live flowers and a big shoot.",a:"The golden mean and the choice of most couples. Everything for a perfect picture: stylish floristry, an extended photo shoot and full coordination of the day. A magazine-cover result at an honest price.",i:["🌺 Live floristry: arch decorated with fresh tropical flowers.","📸 Photo maxi: full shoot up to 4 hours (getting ready + ceremony + sunset at the hotel/palms).","🥂 Service: champagne, glasses, fruit plate and a signing table.","💍 Details: bridal bouquet and boutonniere of live flowers.","📝 Coordination: full timing and supplier control."]}}, /* TODO: название «Основной» подтвердить */
 {id:"gold",loc:"beach",price:990,ru:{n:"Золотой Стандарт",s:"Безупречный стиль и включённый образ невесты.",a:"Пакет для тех, кто ценит качество и не хочет рисковать. Главное преимущество: мы уже включили в стоимость услуги профессионального стилиста. Вам не нужно искать мастеров в Азии: ваш макияж и причёска будут идеальны, а церемония продумана до мелочей.",i:["💄 Стилист: профессиональный макияж и причёска (выезд в ваш отель).","🌟 Всё из тарифа «Основной»: живые цветы, ведущий, шампанское.","📸 Фото-премиум: расширенная ретушь и помощь в позировании.","💒 Улучшенный декор: дополнительные элементы оформления прохода или зоны регистрации.","🧁 Комплимент: расширенный фуршет (пирожные или улучшенные фрукты)."]},
  en:{n:"Gold Standard",s:"Flawless style and the bride's look included.",a:"For those who value quality and don't want to risk. The main benefit: a professional stylist is already included. No need to look for masters in Asia: your makeup and hair will be perfect and the ceremony thought through.",i:["💄 Stylist: professional makeup and hair (at your hotel).","🌟 Everything from \"Main\": live flowers, host, champagne.","📸 Photo premium: extended retouching and posing help.","💒 Upgraded decor: extra elements for the aisle or registration area.","🧁 Compliment: extended buffet (pastries or upgraded fruit)."]}},
 {id:"comfort",loc:"beach",price:1500,ru:{n:"Комфорт (VIP)",s:"Максимальные возможности и свобода желаний.",a:"Это не просто пакет, это конструктор вашего идеального дня. Вы получаете полную свободу: в стоимость уже заложен бюджет на любые дополнительные услуги. Хотите видеоклип, джип-тур или ужин на пляже? Мы реализуем любой сценарий, чтобы вы чувствовали абсолютный комфорт.",i:["💎 Всё включено: база тарифа «Золотой Стандарт» (стилист, цветы, ведущий).","💰 Депозит $500: включён бюджет на выбор доп. услуг (видеограф / джип / дрон / ужин). Это бюджет на допы, а не предоплата за бронь.","🚘 Логистика: приоритетная организация трансфера и сложных маршрутов.","🥥 Песочная церемония: красивый ритуал объединения семей в подарок.","🕶 VIP-сопровождение: личный контроль организатора 24/7."]},
  en:{n:"Comfort (VIP)",s:"Maximum possibilities and freedom of wishes.",a:"Not just a package but a builder of your perfect day. Full freedom: a budget for any extra services is already included. Want a video clip, jeep tour or beach dinner? We realize any scenario so you feel absolute comfort.",i:["💎 All inclusive: base of \"Gold Standard\" (stylist, flowers, host).","💰 $500 deposit: budget for extras (videographer / jeep / drone / dinner) included. It is an extras budget, not a booking prepayment.","🚘 Logistics: priority transfer and complex route organization.","🥥 Sand ceremony: a beautiful family-unity ritual as a gift.","🕶 VIP support: personal organizer control 24/7."]}},

 else if(g.hasAttribute("data-copy")){navigator.clipboard&&navigator.clipboard.writeText(lead()).catch(()=>{});postLead()}});
/* ---- шапка и появление блоков ---- */
let ih=null;const onScroll=()=>{const h=scrollY<innerHeight*.6;$("#topbar").classList.toggle("solid",!h);if(h!==ih){ih=h;document.body.classList.toggle("inhero",h);document.documentElement.style.setProperty("--sh",($("#stk").offsetHeight||0)+"px")}};addEventListener("scroll",onScroll,{passive:true});onScroll();
if("IntersectionObserver"in window){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.04});$$(".rv").forEach(e=>io.observe(e))}else $$(".rv").forEach(e=>e.classList.add("in"));
/* ---- бот: без токенов, только клиентская логика ---- */
let mode="",li=0;const keys=["loc","name","date","guests","fmt","contact"];
const add=(x,u)=>{const m=document.createElement("div");m.className="m"+(u?" u":"");m.textContent=x;$("#msgs").append(m);m.scrollIntoView()};
function qr(list){$("#qr").innerHTML=(list||[]).map(q=>`<button>${q}</button>`).join("")}
function ask(){if(li<keys.length){add(tt().b.lead[li]);const k=keys[li];qr(k=="loc"?tt().loc:k=="fmt"?tt().fm:[])}else{qr([]);add(tt().b.done);const a=document.createElement("div");a.className="m";a.innerHTML=links().map(l=>`<a href="${l[1]}" target="_blank" rel="noopener" data-copy>${l[0]}</a>`).join(" · ");$("#msgs").append(a);postLead();update();mode=""}}
function answer(x){const b=tt().b,v=x.toLowerCase(),loc=/бассейн|pool/.test(v)?"pool":/пляж|beach/.test(v)?"beach":S.loc,P=CONFIG.tariffs.filter(t=>t.loc==loc);
 if(/дрон|drone|джип|jeep|фейерверк|firework|отмен|cancel|залог|адрес|address|название|bar name|артист|artist|огнен|fire|кокос|coconut|невест|bride|стилист|stylist/.test(v))return b.unk;
 if(/предоплат|prepay|аванс/.test(v))return b.prepay;
 if(/только фото|photo only|просто фото/.test(v))return b.photo;
 if(/20 ?км|далеко|выезд|trip|far/.test(v))return b.far;
 const a=CONFIG.addons.find(a=>a.kw&&new RegExp(a.kw).test(v));if(a){if(!a.l.includes(loc))return b.notHere;const p=typeof a.p=="object"?a.p[loc]:a.p,t=a.t&&a.t[loc];return`${a[L][0]}: ${a[L][1]}. ${p!=null?(a.from?tt().from+" +":"+")+usd(p):b.priceTbd}${t?" · "+tt().forT+" "+t.map(tn).join(", "):""}`}
 if(/стоит|цен|price|cost|how much|сколько/.test(v))return P.map(t=>tf(t).n+": "+usd(t.price)).join("\n")+"\n"+b.calc;
 if(/отлич|differ|compar/.test(v))return b.diff[loc];
 if(/дожд|rain|погод|weather/.test(v)){if(loc=="pool")return b.rainPool;const f=CONFIG.faq.beach[0],r=L=="ru"?f[2]:f[3];return r[0]=="["?b.unk:r}
 if(/торт|cake|шампан|champagne|22:00|крыт|правил|rules|вместим|capacity/.test(v)||(loc=="pool"&&/гост|guest/.test(v)))return b.rules;
 if(/дат|date|свобод|avail/.test(v))return b.calc;
 const tr=P.find(t=>v.includes(tf(t).n.toLowerCase().split(" ")[0]));if(tr&&/вход|includ|что/.test(v))return b.first+"\n"+tf(tr).i.join("\n");
 return b.unk}
function handle(x){add(x,1);
 if(mode=="lead"){const k=keys[li];
  if(k=="loc")setLoc(/бассейн|pool/i.test(x)?"pool":"beach",false);
  else if(k=="name"){S.name=x;$("#fn").value=x}else if(k=="date"){S.date=x;if(/^\d{4}-\d\d-\d\d$/.test(x))$("#fd").value=x}
  else if(k=="guests"){S.guests=(x.match(/\d+/)||[""])[0];$("#fg").value=S.guests;update();if(S.over)add(tt().b.unk)}
  else if(k=="fmt"){const i=tt().fm.findIndex(f=>f.toLowerCase()==x.toLowerCase());if(i>=0){S.fmt=i;render()}}
  else if(k=="contact"){S.contact=x;$("#fc").value=x}
  li++;return ask()}
 if(/заявк|request|leave/i.test(x)){mode="lead";li=0;return ask()}
 add(answer(x))}
$("#chatBtn").onclick=()=>{$("#chat").classList.add("open");$("#chatBtn").style.display="none";if(!$("#msgs").children.length){add(tt().b.hi);qr(tt().b.qs)}$("#ci").focus()};
$("#cx").onclick=()=>{$("#chat").classList.remove("open");$("#chatBtn").style.display=""};
$("#qr").onclick=e=>{if(e.target.tagName=="BUTTON")handle(e.target.textContent)};
$("#cf").onsubmit=e=>{e.preventDefault();const v=$("#ci").value.trim();if(v){$("#ci").value="";handle(v)}};
render();
