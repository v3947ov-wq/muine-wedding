const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let L=localStorage.getItem("l")||"ru";if(!T[L])L="ru";
const S={step:0,date:"",guests:"",fmt:"",budget:"",tariff:"",name:"",contact:""};
const tt=()=>T[L],tf=x=>x[L];
const iso=d=>d.toISOString().slice(0,10);
function freeDates(){const t=new Date(),o=[];for(let i=1;i<=92;i++){const d=new Date(t);d.setDate(t.getDate()+i);if(!CONFIG.busy.includes(iso(d)))o.push(iso(d))}return o}
function render(){document.documentElement.lang=L;
 $$("[data-i]").forEach(e=>e.textContent=tt()[e.dataset.i]);
 $("#lang").innerHTML=Object.keys(T).map(k=>`<button class="${k==L?"on":""}" data-l="${k}">${k.toUpperCase()}</button>`).join("");
 $("#calP").textContent=tt().calP();
 $("#tr").innerHTML=CONFIG.tariffs.map(x=>{const d=tf(x);return`<article class="card ${x.pop?"pop":""} ${x.arch?"arch":""}">${x.pop?`<span class="tag">${tt().pop}</span>`:""}${x.arch?`<span class="tag">${tt().archTag}</span>`:""}<h3>${d.n}</h3><div class="price">${x.price?"$"+x.price:tt().priceTBD}</div><p><b>${d.s}</b></p><p>${d.a}</p>${x.arch?`<div class="slots"><!-- 3-4 фото арок: img/arch1.jpg … -->${[1,2,3,4].map(i=>`<img class="slot" loading="lazy" alt="" src="img/${["arch-dip","arch-kiss","champagne-toast","arch-eucalyptus"][i-1]}.jpg">`).join("")}</div>`:""}<details><summary>${tt().inc}</summary><ul class="inc">${d.i.map(i=>`<li>${i}</li>`).join("")}</ul></details><button class="btn" data-t="${x.id}">${tt().pick}</button></article>`}).join("");
 $("#addG").innerHTML=CONFIG.addons.map(a=>`<div class="box"><div style="font-size:30px">${a[0]}</div><h3>${L=="ru"?a[1]:a[2]}</h3><p>${CONFIG.addPrice}</p></div>`).join("");
 $("#howG").innerHTML=tt().steps.map((s,i)=>`<div class="box"><h3>${i+1}</h3><p>${s}</p></div>`).join("");
 renderPort();
 $("#rg").innerHTML=Array.from({length:CONFIG.reviews},()=>`<div class="box"><p>[ОТЗЫВ / REVIEW]</p><small>[ИМЯ, ГОРОД]</small></div>`).join("");
 renderCal();
 $("#faqG").innerHTML=CONFIG.faq.map(f=>`<details><summary>${L=="ru"?f[0]:f[1]}</summary><p>${L=="ru"?f[2]:f[3]}</p></details>`).join("");
 $("#ftC").textContent=CONFIG.contacts.phone;$("#ci").placeholder=tt().ph;
 renderQuiz();summary();
}
let pf="all";
function renderPort(){const loc=[...new Set(CONFIG.portfolio.map(p=>p[0]))];
 $("#pf").innerHTML=[["all",tt().all],...CONFIG.portfolio.map(p=>[p[0],L=="ru"?p[1]:p[2]])].filter((v,i,a)=>a.findIndex(z=>z[0]==v[0])==i).map(f=>`<button class="opt ${pf==f[0]?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("");
 $("#pg").innerHTML=CONFIG.portfolio.filter(p=>pf=="all"||p[0]==pf).map((p,i)=>`<figure style="margin:0"><img loading="lazy" src="img/${p[3]}.jpg" alt="${L=="ru"?p[1]:p[2]}"></figure>`).join("")}
function renderCal(){let h="";const t=new Date();for(let m=0;m<3;m++){const f=new Date(t.getFullYear(),t.getMonth()+m,1),days=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
 h+=`<div><h3>${f.toLocaleDateString(L,{month:"long",year:"numeric"})}</h3><div class="mg">`+"<span></span>".repeat((f.getDay()+6)%7);
 for(let d=1;d<=days;d++){const x=new Date(f.getFullYear(),f.getMonth(),d),k=new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10),past=x<=t,busy=CONFIG.busy.includes(k);
 h+=`<button class="d ${past?"past":""} ${busy?"busy":""} ${S.date==k?"sel":""}" ${past||busy?"disabled":""} data-d="${k}">${d}</button>`}h+="</div></div>"}$("#calG").innerHTML=h}
function rec(){const b=CONFIG.budgets[S.budget];if(b===null)return{r:CONFIG.tariffs.find(x=>x.arch)};
 const pr=CONFIG.tariffs.filter(x=>x.price).sort((a,b)=>a.price-b.price);let r=pr.filter(x=>x.price<=b).pop()||pr[0];return{r,u:pr[pr.indexOf(r)+1]}}
function renderQuiz(){const q=$("#qbody"),s=S.step,t=tt();$("#bar").style.width=(s+(s>3?1:0))*25+"%";
 if(s>3){const{r,u}=rec(),nm=x=>tf(x).n+" ("+(x.price?"$"+x.price:t.priceTBD)+")";
  q.innerHTML=`<div class="res"><p>${t.rec}: <b>${nm(r)}</b></p><p>${tf(r).s}</p>${u&&u!==r?`<p>${t.up} <b>${nm(u)}</b></p>`:""}${S.fmt==3?`<p>${t.priceTBD} (${t.fm[3]})</p>`:""}</div><button class="btn o" style="color:#fff" id="qb">${t.back}</button> <button class="btn" id="qs" style="background:var(--sand);color:var(--sea)">${t.send}</button>`;
  $("#qb").onclick=()=>{S.step=3;renderQuiz()};$("#qs").onclick=()=>{S.tariff=r.id;summary();location.hash="#final";postLead()};return}
 let body;if(s==0)body=`<input type="date" id="qi" value="${S.date}" min="${iso(new Date())}" aria-label="${t.q[0]}">`;
 else if(s==1)body=`<input type="number" id="qi" min="1" value="${S.guests}" aria-label="${t.q[1]}">`;
 else body=`<div class="opts">${(s==2?t.fm:t.bd).map((o,i)=>`<button class="opt ${S[s==2?"fmt":"budget"]===i?"on":""}" data-o="${i}">${o}</button>`).join("")}</div>`;
 q.innerHTML=`<h3 style="color:#fff">${t.q[s]}</h3>${body}<div>${s?`<button class="btn o" style="color:#fff" id="qb">${t.back}</button> `:""}<button class="btn" id="qn" style="background:var(--sand);color:var(--sea)">${t.next}</button></div>`;
 if(s<2)$("#qi").oninput=e=>{S[s?"guests":"date"]=e.target.value;summary()};
 $("#qn").onclick=()=>{S.step++;renderQuiz()};if(s)$("#qb").onclick=()=>{S.step--;renderQuiz()}}
function lead(){const t=S.tariff?tf(CONFIG.tariffs.find(x=>x.id==S.tariff)).n:"—";
 const f=S.fmt!==""?tt().fm[S.fmt]:"—",b=S.budget!==""?tt().bd[S.budget]:"—";
 return `Привет! / Hi! ${S.name?S.name+". ":""}\nДата/Date: ${S.date||"—"}\nГостей/Guests: ${S.guests||"—"}\nФормат/Format: ${f}\nТариф/Package: ${t}\nБюджет/Budget: ${b}${S.contact?"\nКонтакт/Contact: "+S.contact:""}`}
function links(){const m=encodeURIComponent(lead());return[["Telegram",`https://t.me/${CONFIG.contacts.tgUser}?text=${m}`],["WhatsApp",`https://wa.me/${CONFIG.contacts.wa}?text=${m}`],["Zalo",CONFIG.contacts.zalo]]}
function summary(){$("#summ").innerHTML=(S.tariff?tt().sel+" <b>"+tf(CONFIG.tariffs.find(x=>x.id==S.tariff)).n+"</b> · ":"")+(S.date||"");
 $("#finB").innerHTML=links().map(l=>`<a class="btn" target="_blank" rel="noopener" href="${l[1]}" data-copy>${l[0]}</a>`).join("")}
function postLead(){if(CONFIG.endpoint==="FORM_ENDPOINT")return;fetch(CONFIG.endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({...S,text:lead()})}).catch(()=>{})}
document.addEventListener("click",e=>{const g=e.target.closest("[data-l],[data-t],[data-o],[data-f],[data-d],[data-copy]");if(!g)return;const d=g.dataset;
 if(d.l){L=d.l;localStorage.setItem("l",L);render()}
 else if(d.t){S.tariff=d.t;summary();location.hash="#final"}
 else if(d.o!==undefined){S[S.step==2?"fmt":"budget"]=+d.o;renderQuiz()}
 else if(d.f){pf=d.f;renderPort()}
 else if(d.d){S.date=d.d;renderCal();summary()}
 else if(g.hasAttribute("data-copy")){navigator.clipboard&&navigator.clipboard.writeText(lead()).catch(()=>{});postLead()}});
/* ---- чат-бот: без токенов, только клиентская логика ---- */
let mode="",li=0;const keys=["name","date","guests","fmt","tariff","budget","contact"];
const add=(t,u)=>{const m=document.createElement("div");m.className="m"+(u?" u":"");m.textContent=t;$("#msgs").append(m);m.scrollIntoView()};
function qr(){$("#qr").innerHTML=tt().b.qs.map(q=>`<button>${q}</button>`).join("");}
function ask(){if(li<keys.length)add(tt().b.lead[li]);else{add(tt().b.done);const a=document.createElement("div");a.className="m";a.innerHTML=links().map(l=>`<a href="${l[1]}" target="_blank" rel="noopener" data-copy>${l[0]}</a>`).join(" · ");$("#msgs").append(a);postLead();summary();mode=""}}
function answer(x){const b=tt().b,v=x.toLowerCase(),P=CONFIG.tariffs.filter(t=>t.price);
 if(/арк|arch/.test(v))return b.arch;
 if(/стоит|цен|price|cost|how much|сколько/.test(v))return P.map(t=>tf(t).n+": $"+t.price).join("\n");
 if(/отлич|differ|compar/.test(v))return b.diff;
 if(/дожд|rain|погод|weather/.test(v)){const f=CONFIG.faq[0],a=L=="ru"?f[2]:f[3];return a[0]=="["?b.unk:a}
 if(/дат|date|свобод|avail/.test(v))return b.free();
 const t=P.find(t=>v.includes(tf(t).n.toLowerCase().split(" ")[0]));if(t&&/вход|includ|что/.test(v))return tf(t).i.join("\n");
 return b.unk}
function handle(x){add(x,1);
 if(mode=="lead"){const k=keys[li];S[k]=x;if(k=="tariff"){const t=CONFIG.tariffs.find(t=>tf(t).n.toLowerCase().includes(x.toLowerCase().split(" ")[0]));S.tariff=t?t.id:S.tariff}
  if(k=="contact")S.contact=x;li++;return ask()}
 if(/заявк|request|leave/i.test(x)){mode="lead";li=0;return ask()}
 add(answer(x))}
$("#chatBtn").onclick=()=>{$("#chat").classList.add("open");$("#chatBtn").style.display="none";if(!$("#msgs").children.length){add(tt().b.hi);qr()}$("#ci").focus()};
$("#cx").onclick=()=>{$("#chat").classList.remove("open");$("#chatBtn").style.display=""};
$("#qr").onclick=e=>{if(e.target.tagName=="BUTTON")handle(e.target.textContent)};
$("#cf").onsubmit=e=>{e.preventDefault();const v=$("#ci").value.trim();if(v){$("#ci").value="";handle(v)}};
render();
